name: F-Droid test APKs
# Verifies the NOX dashboard, settings, about page and test APK variants.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/nox-brand-refresh
      - feature/nox-ui-refresh
      - feature/nox-full-ui
    paths:
      - '.github/workflows/fdroid-test-apks.yml'
      - 'scripts/build-ispeed.sh'
      - 'compile-hevtun.sh'
      - 'V2rayNG/app/**'
      - 'V2rayNG/gradle/**'

permissions:
  contents: write

concurrency:
  group: fdroid-test-apks
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build five F-Droid test APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools ndk;30.0.16248370'

      - name: Build native inputs and F-Droid debug APKs
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          bash scripts/build-ispeed.sh debug

      - name: Verify all five APK outputs exist
        shell: bash
        run: |
          set -euo pipefail
          apk_dir="V2rayNG/app/build/outputs/apk/fdroid/debug"
          for abi in arm64-v8a armeabi-v7a x86_64 x86 universal; do
            file="$(find "$apk_dir" -maxdepth 1 -type f -name "*-fdroid_${abi}.apk" -print -quit)"
            if [[ -z "$file" ]]; then
              echo "Missing APK for ABI: $abi" >&2
              exit 1
            fi
            echo "Found: $file"
          done
          test "$(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 5

      - name: Create checksums
        shell: bash
        run: |
          cd V2rayNG/app/build/outputs/apk/fdroid/debug
          sha256sum *.apk > SHA256SUMS

      - name: Publish prerelease with five test APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}-${{ github.sha }}
          name: NOX test build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            V2rayNG/app/build/outputs/apk/fdroid/debug/*.apk
            V2rayNG/app/build/outputs/apk/fdroid/debug/SHA256SUMS
